name: margi

# Production stack for a host that already runs Traefik (Dokploy): MARGI brings its own Postgres
# (pgvector) and Redis, and only `margi-web` joins Traefik's `dokploy-network`. The API, database
# and cache stay on this project's private network with no published ports.
# Secrets live in `.env.production` (see deploy/production.env.example); it is never committed.

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  margi-postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    logging: *logging
    mem_limit: 768m
    cpus: 1.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-margi}
    command:
      - postgres
      - -c
      - shared_buffers=192MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=8MB
      - -c
      - max_connections=60
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  margi-redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 128m
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '96mb',
        '--maxmemory-policy',
        'allkeys-lru',
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  margi-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    restart: unless-stopped
    logging: *logging
    mem_limit: 768m
    cpus: 1.5
    env_file: .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@margi-postgres:5432/${POSTGRES_DB:-margi}?schema=public
      REDIS_URL: redis://margi-redis:6379
    depends_on:
      margi-postgres:
        condition: service_healthy
      margi-redis:
        condition: service_healthy

  margi-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    logging: *logging
    mem_limit: 96m
    cpus: 0.5
    depends_on:
      margi-api:
        condition: service_healthy
    networks:
      - default
      - dokploy-network
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/ >/dev/null || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
    # Traefik routes only when TRAEFIK_ENABLE=true, which is switched on after DNS points here so
    # Let's Encrypt is not asked for a certificate it cannot validate.
    labels:
      - traefik.enable=${TRAEFIK_ENABLE:-false}
      - traefik.docker.network=dokploy-network
      - traefik.http.services.margi-web.loadbalancer.server.port=80
      - traefik.http.routers.margi-web.rule=Host(`${DOMAIN:-margi.invalid}`)
      - traefik.http.routers.margi-web.entrypoints=websecure
      - traefik.http.routers.margi-web.tls.certresolver=letsencrypt
      - traefik.http.routers.margi-web-http.rule=Host(`${DOMAIN:-margi.invalid}`)
      - traefik.http.routers.margi-web-http.entrypoints=web
      - traefik.http.routers.margi-web-http.middlewares=redirect-to-https@file
      # www is sent to the main domain (needs a DNS record for www; its certificate is issued too).
      - traefik.http.middlewares.margi-www.redirectregex.regex=^https?://www\.(.+)
      - traefik.http.middlewares.margi-www.redirectregex.replacement=https://$${1}
      - traefik.http.middlewares.margi-www.redirectregex.permanent=true
      - traefik.http.routers.margi-www.rule=Host(`www.${DOMAIN:-margi.invalid}`)
      - traefik.http.routers.margi-www.entrypoints=websecure
      - traefik.http.routers.margi-www.tls.certresolver=letsencrypt
      - traefik.http.routers.margi-www.middlewares=margi-www
      - traefik.http.routers.margi-www-http.rule=Host(`www.${DOMAIN:-margi.invalid}`)
      - traefik.http.routers.margi-www-http.entrypoints=web
      - traefik.http.routers.margi-www-http.middlewares=margi-www

networks:
  dokploy-network:
    external: true

volumes:
  postgres_data:
  redis_data:
