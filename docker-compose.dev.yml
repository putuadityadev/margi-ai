name: margi-ai-dev

# Development-only backing services (TDD §18.1, §18.4).
# Credentials read from `.env` when present; fallback defaults below are strictly for 127.0.0.1 dev.
services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-margi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-margi_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-margi_dev}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - margi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - margi_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-margi_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-margi_minio_dev_only}
    ports:
      - '127.0.0.1:${S3_PORT:-9000}:9000'
      - '127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001'
    volumes:
      - margi_minio_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio-init:
    image: minio/mc:latest
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-margi_minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-margi_minio_dev_only}
      S3_BUCKET_UPLOADS: ${S3_BUCKET_UPLOADS:-user-uploads}
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC:-public-venues}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$${S3_ACCESS_KEY}\" \"$${S3_SECRET_KEY}\" &&
      mc mb --ignore-existing \"local/$${S3_BUCKET_UPLOADS}\" &&
      mc anonymous set none \"local/$${S3_BUCKET_UPLOADS}\" &&
      mc mb --ignore-existing \"local/$${S3_BUCKET_PUBLIC}\" &&
      mc anonymous set download \"local/$${S3_BUCKET_PUBLIC}\"
      "

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025'
    volumes:
      - margi_mailpit_data:/data
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  margi_postgres_data:
  margi_redis_data:
  margi_minio_data:
  margi_mailpit_data:
